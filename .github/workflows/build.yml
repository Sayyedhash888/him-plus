name: Build Windows x64

# Release builds run on version tags (v*) or manually from the Actions tab.
# Code signing is NOT configured for this project: the workflow produces
# unsigned portable artifacts on purpose. Do not add placeholder signing steps;
# provision a real certificate first.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The node:test suites run TypeScript sources directly. Node 22 needs
      # explicit type stripping (newer Node releases enable it by default).
      - name: Run tests
        env:
          NODE_OPTIONS: '--experimental-strip-types'
        run: npm test

      - name: Build renderer and Electron main process
        run: npm run build

      # `package:win` runs the build again and then emits the portable folder
      # plus release/HIM+-win32-x64/SHA256SUMS.txt.
      - name: Package Windows app
        run: npm run package:win

      - name: Verify and write SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'release\HIM+-win32-x64\HIM+.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Packaged executable not found: $exe"
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Join-Path $env:GITHUB_WORKSPACE 'release\HIM+-win32-x64\SHA256SUMS.txt'
          if (Test-Path -LiteralPath $sums) {
            $scriptHash = ((Get-Content -LiteralPath $sums -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            if ($scriptHash -and $scriptHash -ne $hash) {
              throw "SHA256SUMS.txt does not match $exe (script: $scriptHash, computed: $hash)"
            }
          }
          "$hash  HIM+.exe" | Set-Content -LiteralPath $sums -Encoding ascii
          Get-Content -LiteralPath $sums

      - name: Add unsigned build notice
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'package.json') -Raw | ConvertFrom-Json).version
          $info = @(
            "HIM+ $version - Windows x64 portable build"
            "Commit: $env:GITHUB_SHA"
            "Ref: $env:GITHUB_REF"
            "Workflow run: $env:GITHUB_RUN_ID"
            "Code signing: not configured (unsigned artifact)"
          )
          $info | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'release\HIM+-win32-x64\BUILD-INFO.txt') -Encoding utf8

      - name: Upload portable build (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: HIM+-win32-x64-unsigned
          path: release/HIM+-win32-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: HIM+-win32-x64-sha256
          path: release/HIM+-win32-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
