<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#09090B" />

  <defs>
    <mask id="cutout-plus">
      <rect width="100%" height="100%" fill="white" />
      <rect x="135" y="70" width="10" height="24" rx="2" fill="black" />
      <rect x="128" y="77" width="24" height="10" rx="2" fill="black" />
    </mask>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.04" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#dot-grid)" />

  <rect x="50" y="35" width="130" height="130" rx="32" fill="#FFFFFF" />

  <rect x="80" y="65" width="22" height="70" rx="4" fill="#09090B" />
  <rect x="95" y="98" width="30" height="16" fill="#09090B" />
  <rect x="120" y="65" width="40" height="70" rx="8" fill="#09090B" mask="url(#cutout-plus)" />

  <text x="220" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="#FFFFFF">HIM</text>
  <text x="375" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#71717A">+</text>

  <text x="226" y="154" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="4.5" fill="#71717A">INTEGRATED DEVELOPMENT ENVIRONMENT</text>

  <rect x="585" y="144" width="6" height="12" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
  </rect>
</svg>